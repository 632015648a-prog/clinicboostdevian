services:
  # ─── PostgreSQL (desarrollo local) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicboost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── .NET API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/ClinicBoost.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DATABASE_URL: Host=db;Database=clinicboost;Username=postgres;Password=postgres
      JWT_SECRET: dev-secret-key-min-32-chars-long!!
      JWT_ISSUER: https://clinicboost.io
      JWT_AUDIENCE: clinicboost-dashboard
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend (dev server) ──────────────────────────────────────────
  web:
    build:
      context: src/ClinicBoost.Web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - api

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
